
# Fix Vim ESC delay
set -sg escape-time 0

# Increase scrollback buffer
set -g history-limit 50000

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Enable mouse support
set -g mouse on

# Enable focus events for vim autoread
set -g focus-events on

# Aggressive resize for multi-client
setw -g aggressive-resize on

# ============================================
# KEY BINDINGS
# ============================================

# Change prefix to Ctrl+a (more ergonomic)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

bind r source-file ~/.tmux.conf

# ============================================
# DESIGN TWEAKS
# ============================================
# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# copy mode
setw -g mode-style 'fg=black bg=red bold'

# panes
set -g pane-border-style 'fg=white'
set -g pane-active-border-style 'fg=lime'

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=red'

set -g status-left ''
set -g status-left-length 10

# set -g status-right-style 'fg=black bg=yellow'
set -g status-right ''
# set -g status-right-length 50

setw -g window-status-current-style 'fg=black bg=lime'
setw -g window-status-current-format ' #I #W #F '

setw -g window-status-style 'fg=red bg=black'
setw -g window-status-format ' #I #[fg=white]#W #[fg=yellow]#F '

setw -g window-status-bell-style 'fg=yellow bg=red bold'

# messages
set -g message-style 'fg=lime bold'


# PLUGINS
set -g @tpm_plugins '	\
	tmux-plugins/tpm	\
	tmux-plugins/tmux-sensible	\
	tmux-plugins/tmux-resurrect	\
	tmux-plugins/tmux-continuum	\
	tmux-plugins/tmux-pain-control	\
	alexwforsythe/tmux-which-key	\
	sainnhe/tmux-fzf	\
'

# CONFIG
set -g @continuum-restore 'on'


# INIT
run '~/.tmux/plugins/tpm/tpm'
